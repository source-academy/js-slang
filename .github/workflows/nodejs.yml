# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Check for package-lock.json
        run: |
          if [ -e package-lock.json ]; then
            echo "package-lock.json found; please do not use NPM! This project uses Yarn!"
            exit 1
          fi
          exit 0
      # Has to be run before actions/setup-node.
      # See: https://github.com/actions/setup-node/issues/480
      - name: Enable corepack for Yarn
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # The autocomplete builtin data (src/conductor/plugins/autocomplete/builtins/*.json) is
      # committed, not generated at build time, so a docs/lib/*.js edit that forgot to also run
      # `yarn autocomplete` would otherwise land green and only surface as stale autocomplete
      # suggestions once someone actually opened the playground.
      - run: yarn autocomplete
      - run: git diff --exit-code -- src/conductor/plugins/autocomplete/builtins
      - run: yarn build
      # Bundles the Conductor evaluators. Not covered by `yarn build` (which is tsc for the
      # published library) and not exercised by the test suite either, so without this a change
      # that breaks browser bundling — a newly reachable Node builtin, an inline require() that
      # rollup cannot rewrite — would land green and only surface when someone ran the worker.
      - run: yarn build:evaluators
      - run: yarn format:ci
      - run: yarn eslint
      - run: yarn test-coverage
        env:
          CI: true
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
