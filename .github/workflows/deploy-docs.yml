on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies (apt)
        run: |
          sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends \
          texlive texlive-fonts-extra texlive-lang-cjk latexmk latex-cjk-all
      # Has to be run before actions/setup-node.
      # See: https://github.com/actions/setup-node/issues/480
      - name: Enable corepack for Yarn
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --immutable
      - name: Build
        run: |
          yarn run jsdoc prepare
          find docs/source -name .gitignore -delete -print
      - name: Deploy (/javascript, the canonical URL going forward)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          publish_dir: docs/source
          external_repository: source-academy/docs.sourceacademy.org
          publish_branch: master
          keep_files: true
          # Mirrors how py-slang publishes into /python alongside the root - see
          # py-slang's deploy-docs.yml. https://docs.sourceacademy.org/javascript is the
          # language docs' new canonical URL, following the "Source" -> "JavaScript" rename.
          # This step must run (and thus publish docs/source's real, full index.html here)
          # before docs/source/index.html gets overwritten with the root redirect stub below.
          destination_dir: javascript
      - name: Replace the root index page with a pointer to /javascript
        run: cp docs/root_redirect.html docs/source/index.html
      # peaceiris/actions-gh-pages starts an ssh-agent on a fixed socket path
      # (/tmp/ssh-auth.sock) and leaves it running; a second invocation of the action in the same
      # job then fails to bind its own agent to that same path ("Address already in use"). Kill
      # the first step's agent (ssh-agent -k reads $SSH_AUTH_SOCK/$SSH_AGENT_PID, which the first
      # step already exported to the job environment) before the second deploy step starts one of
      # its own.
      - name: Stop the ssh-agent the previous deploy step started
        run: |
          ssh-agent -k || true
          rm -f /tmp/ssh-auth.sock
      - name: Deploy (root, kept only for old deep links like /source_1/ or /source_1.pdf)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          publish_dir: docs/source
          external_repository: source-academy/docs.sourceacademy.org
          publish_branch: master
          # Do not wipe the branch: keep files published by other sources
          # (e.g. py-slang's Python docs under /python). Previously this used
          # force_orphan: true, which replaced the whole branch on every deploy.
          keep_files: true
          cname: docs.sourceacademy.org
